name: PR Patch Notes

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
      - dev

permissions:
  contents: read
  pull-requests: write

jobs:
  patch-notes:
    name: Generate & Post PR Patch Notes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Generate PR patch notes
        run: |
          node scripts/generate-patch-notes.mjs \
            --mode=pr \
            --base="origin/${{ github.base_ref }}" \
            --head="HEAD" \
            --out="/tmp/pr-patch-notes.md"
          cat /tmp/pr-patch-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update PR patch notes comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");
            const body = fs.readFileSync("/tmp/pr-patch-notes.md", "utf8");
            const marker = "<!-- cj-patch-notes -->";
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find(
              (c) => c.user?.type === "Bot" && c.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }
